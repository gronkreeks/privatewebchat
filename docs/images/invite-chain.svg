<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6ea2ff"/></marker>
  </defs>
  <rect width="880" height="320" rx="8" fill="#000000"/>

  <!-- Developer -->
  <rect x="24" y="64" width="190" height="104" rx="6" fill="#0c0c0c" stroke="#367bf0" stroke-width="2"/>
  <text x="119" y="100" fill="#fff" font-size="18" font-weight="700" text-anchor="middle">you</text>
  <text x="119" y="122" fill="#6ea2ff" font-size="12" font-weight="700" text-anchor="middle">DEVELOPER · OWNER</text>
  <text x="119" y="146" fill="#9b9b9b" font-size="12" text-anchor="middle">key = OWNER_KEY on Render</text>

  <!-- Invites -->
  <rect x="300" y="34" width="170" height="54" rx="27" fill="rgba(110,162,255,0.08)" stroke="rgba(110,162,255,0.45)" stroke-dasharray="5 4"/>
  <text x="385" y="58" fill="#6ea2ff" font-size="13" font-weight="700" text-anchor="middle">invite code</text>
  <text x="385" y="76" fill="#9b9b9b" font-size="11" text-anchor="middle">one use · expires</text>
  <rect x="300" y="144" width="170" height="54" rx="27" fill="rgba(110,162,255,0.08)" stroke="rgba(110,162,255,0.45)" stroke-dasharray="5 4"/>
  <text x="385" y="168" fill="#6ea2ff" font-size="13" font-weight="700" text-anchor="middle">invite code</text>
  <text x="385" y="186" fill="#9b9b9b" font-size="11" text-anchor="middle">one use · expires</text>

  <!-- Friends -->
  <rect x="556" y="34" width="300" height="54" rx="6" fill="#0c0c0c" stroke="#2c2c2c"/>
  <text x="576" y="58" fill="#fff" font-size="15" font-weight="700">sam</text>
  <text x="576" y="77" fill="#9b9b9b" font-size="12">downloads the app, pastes the code</text>
  <rect x="556" y="144" width="300" height="54" rx="6" fill="#0c0c0c" stroke="#2c2c2c"/>
  <text x="576" y="168" fill="#fff" font-size="15" font-weight="700">leo</text>
  <text x="576" y="187" fill="#9b9b9b" font-size="12">downloads the app, pastes the code</text>

  <path d="M216 100 C255 100 255 61 294 61" stroke="#6ea2ff" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <path d="M216 132 C255 132 255 171 294 171" stroke="#6ea2ff" stroke-width="2.5" fill="none" marker-end="url(#a)"/>
  <line x1="472" y1="61" x2="550" y2="61" stroke="#6ea2ff" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="472" y1="171" x2="550" y2="171" stroke="#6ea2ff" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="250" y="90" fill="#6ea2ff" font-size="11" font-weight="700" text-anchor="middle">signs</text>
  <text x="510" y="52" fill="#6ea2ff" font-size="11" font-weight="700" text-anchor="middle">joins</text>
  <text x="510" y="162" fill="#6ea2ff" font-size="11" font-weight="700" text-anchor="middle">joins</text>

  <text x="440" y="244" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Only the developer can create invite codes, and each code lets in exactly one person.</text>
  <text x="440" y="268" fill="#9b9b9b" font-size="13" text-anchor="middle">Every member holds a certificate signed through an invite you made. The server checks it on every</text>
  <text x="440" y="288" fill="#9b9b9b" font-size="13" text-anchor="middle">connection, so nobody gets in without one, even after a restart. It stores none of this itself.</text>
</svg>
