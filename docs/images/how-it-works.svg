<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f5c518"/></marker>
  </defs>
  <rect width="880" height="330" rx="18" fill="#0f1e3d"/>

  <!-- Sender -->
  <rect x="24" y="40" width="230" height="170" rx="14" fill="#13264b" stroke="rgba(255,255,255,0.15)"/>
  <text x="44" y="74" fill="#fff" font-size="18" font-weight="800">Maya's Hush</text>
  <text x="44" y="104" fill="#c9d3e6" font-size="14">1. Writes a message</text>
  <text x="44" y="128" fill="#c9d3e6" font-size="14">2. Encrypts it on this</text>
  <text x="62" y="148" fill="#c9d3e6" font-size="14">computer, once per</text>
  <text x="62" y="168" fill="#c9d3e6" font-size="14">recipient's key</text>
  <rect x="44" y="180" width="118" height="20" rx="10" fill="rgba(39,174,96,0.18)" stroke="rgba(127,224,168,0.5)"/>
  <text x="103" y="194" fill="#7fe0a8" font-size="11" font-weight="800" text-anchor="middle">ENCRYPTED HERE</text>

  <!-- Relay -->
  <rect x="325" y="40" width="230" height="170" rx="14" fill="#13264b" stroke="#f5c518" stroke-dasharray="5 4"/>
  <text x="345" y="74" fill="#fff" font-size="18" font-weight="800">Relay on Render</text>
  <text x="345" y="98" fill="#f5c518" font-size="13" font-weight="700">wss:// on port 443</text>
  <text x="345" y="126" fill="#c9d3e6" font-size="13">Sees: who → whom, when,</text>
  <text x="345" y="144" fill="#c9d3e6" font-size="13">and how big</text>
  <text x="345" y="172" fill="#ff9a8a" font-size="13">Can't see: the text, room</text>
  <text x="345" y="190" fill="#ff9a8a" font-size="13">names or who's in a room</text>

  <!-- Recipient -->
  <rect x="626" y="40" width="230" height="170" rx="14" fill="#13264b" stroke="rgba(255,255,255,0.15)"/>
  <text x="646" y="74" fill="#fff" font-size="18" font-weight="800">Sam's Hush</text>
  <text x="646" y="104" fill="#c9d3e6" font-size="14">3. Unwraps the message</text>
  <text x="664" y="124" fill="#c9d3e6" font-size="14">key with Sam's own key</text>
  <text x="646" y="150" fill="#c9d3e6" font-size="14">4. Decrypts and saves it</text>
  <text x="664" y="170" fill="#c9d3e6" font-size="14">in the encrypted vault</text>
  <rect x="646" y="180" width="118" height="20" rx="10" fill="rgba(39,174,96,0.18)" stroke="rgba(127,224,168,0.5)"/>
  <text x="705" y="194" fill="#7fe0a8" font-size="11" font-weight="800" text-anchor="middle">DECRYPTED HERE</text>

  <!-- Arrows -->
  <line x1="258" y1="125" x2="318" y2="125" stroke="#f5c518" stroke-width="2.5" marker-end="url(#a)"/>
  <line x1="559" y1="125" x2="619" y2="125" stroke="#f5c518" stroke-width="2.5" marker-end="url(#a)"/>
  <text x="290" y="114" fill="#f5c518" font-size="11" font-weight="800" text-anchor="middle">ciphertext</text>
  <text x="590" y="114" fill="#f5c518" font-size="11" font-weight="800" text-anchor="middle">ciphertext</text>

  <!-- Footer -->
  <text x="440" y="252" fill="#fff" font-size="14" font-weight="700" text-anchor="middle">Every message gets its own AES-256-GCM key, wrapped separately for each recipient</text>
  <text x="440" y="276" fill="#c9d3e6" font-size="13" text-anchor="middle">(ECDH P-256 → HKDF-SHA-256 → AES-KW). Only the real sender could have wrapped a key</text>
  <text x="440" y="296" fill="#c9d3e6" font-size="13" text-anchor="middle">a recipient can open, so messages can't be forged in someone else's name.</text>
</svg>
