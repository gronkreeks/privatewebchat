<!doctype html>
<html lang="en" data-theme="kali">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src wss: ws://localhost:* ws://127.0.0.1:*; base-uri 'none'; form-action 'none'">
  <title>privatewebchat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- First run -->
    <section id="sWelcome" class="screen hidden">
      <div class="card narrow">
        <div class="brand"><span class="logo"></span>privatewebchat</div>
        <label class="lbl" for="joinCode">Invite code</label>
        <textarea id="joinCode" class="in code" rows="4" spellcheck="false" placeholder="Paste your invite code"></textarea>
        <div class="row" id="pasteRow"><button class="link" id="pasteBtn">Paste</button></div>
        <div id="joinMore" class="hidden">
          <label class="lbl" for="joinName">Username</label>
          <input id="joinName" class="in" maxlength="24" autocomplete="off" spellcheck="false" placeholder="Pick a username">
        </div>
        <div class="err" id="joinErr"></div>
        <div class="row end hidden" id="joinRow"><button class="btn" id="joinNext">Continue</button></div>
      </div>
    </section>

    <section id="sSetPin" class="screen hidden">
      <div class="card narrow">
        <h1>Choose a PIN</h1>
        <p class="hint">You'll enter it every time you open privatewebchat. It also encrypts everything privatewebchat stores on this computer, so it can't be reset: if you forget it, you'll need a new invite.</p>
        <label class="lbl" for="newPin">PIN (4 to 12 digits)</label>
        <input id="newPin" class="in pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off">
        <label class="lbl" for="newPin2">Type it again</label>
        <input id="newPin2" class="in pin" type="password" inputmode="numeric" maxlength="12" autocomplete="off">
        <div class="err" id="setPinErr"></div>
        <div class="row end"><button class="link" id="setPinBack">Back</button><button class="btn" id="setPinGo">Set PIN</button></div>
      </div>
    </section>

    <!-- Every launch -->
    <section id="sUnlock" class="screen hidden">
      <div class="card tiny">
        <div class="brand small"><span class="logo"></span>privatewebchat</div>
        <label class="lbl" for="unlockPin">Enter your PIN</label>
        <input id="unlockPin" class="in pin big" type="password" inputmode="numeric" maxlength="12" autocomplete="off">
        <div class="err" id="unlockErr"></div>
        <button class="btn wide" id="unlockGo">Unlock</button>
      </div>
    </section>

    <section id="sGone" class="screen hidden">
      <div class="card narrow">
        <h1 id="goneTitle"></h1>
        <p class="hint" id="goneMsg"></p>
        <div class="row end"><button class="btn danger" id="goneErase">Erase this device</button></div>
      </div>
    </section>

    <!-- Signed in -->
    <section id="sMain" class="main hidden">
      <aside class="side">
        <div class="side-top">
          <div class="brand small"><span class="logo"></span>privatewebchat</div>
          <span class="dot" id="netDot" title="Offline"></span>
        </div>
        <div class="side-scroll">
          <button class="item big" id="navFriends"><span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.4c1.9.8 3 2.8 3 5.6"/></svg></span><span class="nm">Friends</span><span class="badge hidden" id="friendsBadge"></span></button>
          <button class="item big" id="navGeneral"><span class="ico hash">#</span><span class="nm">General</span><span class="badge hidden" id="generalBadge"></span></button>
          <div class="side-h"><span>Messages</span><button class="icon" id="newGroup" title="New group chat">+</button></div>
          <div id="inbox"></div>
        </div>
        <div class="side-bottom">
          <div class="me-row">
            <span class="mebox" id="meBox"></span>
            <button class="icon" id="settingsBtn" title="Settings">⚙</button>
          </div>
          <button class="panic-btn" id="panicBtn" title="Black out the screen">Black out <kbd id="panicKbd"></kbd></button>
        </div>
      </aside>
      <div class="right">
        <div class="banner hidden" id="banner"></div>

        <div class="pane" id="friendsPane">
          <header class="chat-h">
            <div class="tabs">
              <h2>Friends</h2>
              <button class="tab" data-tab="online">Online</button>
              <button class="tab" data-tab="all">All</button>
              <button class="tab" data-tab="pending">Pending <span class="badge hidden" id="pendingBadge"></span></button>
              <button class="tab" data-tab="blocked">Blocked</button>
              <button class="tab add" data-tab="add">Add friend</button>
            </div>
          </header>
          <div class="fbody" id="friendsBody"></div>
        </div>

        <div class="pane hidden" id="chatPane">
          <header class="chat-h">
            <div class="title-row">
              <span id="roomAv"></span>
              <div>
                <h2 id="roomTitle"></h2>
                <div class="sub"><span class="lock">End-to-end encrypted</span><span id="roomSub"></span></div>
              </div>
            </div>
            <button class="link" id="roomAction"></button>
          </header>
          <div class="log" id="log"></div>
          <div class="composer">
            <div class="prompt-top" id="promptTop"></div>
            <div class="composer-row">
              <span class="prompt-dollar">└─$</span>
              <textarea id="msg" rows="1" placeholder="Message" maxlength="2000"></textarea>
              <span class="left" id="msgLeft"></span>
              <button class="btn" id="sendBtn">Send</button>
            </div>
          </div>
          <div class="err pad" id="chatErr"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="modal" class="modal hidden"><div class="card modal-card" id="modalCard" role="dialog" aria-modal="true"></div></div>

  <!-- Black-out screen: nothing on it. Type your PIN and press Enter to come back. -->
  <div id="black" class="hidden">
    <input id="blackPin" type="password" inputmode="numeric" maxlength="12" autocomplete="off" aria-label="PIN">
    <div id="blackDots"></div>
  </div>

  <script src="config.js"></script>
  <script src="protocol.js"></script>
  <script src="vault.js"></script>
  <script src="app.js"></script>
</body>
</html>
