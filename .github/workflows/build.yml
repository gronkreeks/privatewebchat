# Builds privatewebchat for Mac and Windows on every push (download them from the run's Artifacts).
# Pushing a tag like v1.0.0 also publishes both files on the repo's Releases page.
name: Build apps
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
jobs:
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: app/build-mac.sh
      - uses: actions/upload-artifact@v4
        with: { name: privatewebchat-mac, path: app/dist/privatewebchat-mac.zip }
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: app\build-windows.bat
        shell: cmd
      - run: Compress-Archive -Path app/dist/privatewebchat.exe -DestinationPath app/dist/privatewebchat-windows.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: privatewebchat-windows
          path: |
            app/dist/privatewebchat.exe
            app/dist/privatewebchat-windows.zip
  tests:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd server && npm ci
      - run: node tests/protocol.test.js && node tests/server.test.js && NO_SHOTS=1 node tests/ui/run.js
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows, tests]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with: { files: 'out/*' }
